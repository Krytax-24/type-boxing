<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CounterType</title>
    <meta
      name="description"
      content="A real time typing fighting game: type faster than your opponent to hit, guard and land your ultimate."
    />
  </head>
  <body>
    <!-- The arena fills the whole window. Everything else floats over it in #ui, which layout.js scales from a
         1366 x 768 design size to the window. Every component fills its own part of the page: the markup here is
         only the layers they mount into. -->
    <canvas id="arena"></canvas>

    <div id="ui" class="idle">
      <header id="topbar"></header>
      <!-- Each game mode mounts its fight HUD here. -->
      <div id="hud-layer"></div>
      <!-- Shared by the fights: the big countdown and the banner between rounds. -->
      <div id="countdown"></div>
      <div id="round-banner" class="hidden" aria-live="polite"></div>
      <!-- Screens (router.js): one at a time, floating over the live arena. -->
      <div id="overlay" class="hidden">
        <div id="keyline"></div>
      </div>
      <!-- Modals (modals.js): pause, settings and the quit confirm, stacked over a screen or a fight. -->
      <div id="modal" class="hidden"></div>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="perf" class="hidden" aria-hidden="true"></div>
    </div>

    <!-- Load order is by layer: kernel, core, engine, services, UI kit, shell, pages, then the plug-ins (each mode and
         online play in its own block, with its stylesheet), and boot last. Every script registers one module with
         CounterType.define; the kernel starts them in dependency order once the page has loaded. A module whose
         dependency is missing is skipped on its own, so removing a plug-in block never breaks the rest.
         Switch modules off without editing anything: index.html?disable=race,arm. -->
    <!-- Kernel: the module system, the event bus and the registry -->
    <script src="src/kernel/kernel.js?v=20261028a"></script>
    <script src="src/kernel/events.js?v=20261028a"></script>
    <script src="src/kernel/registry.js?v=20261028a"></script>

    <!-- Core: numbers, randomness, words, storage, themes and sound -->
    <script src="src/core/config.js?v=20261028a"></script>
    <script src="src/core/random.js?v=20261028a"></script>
    <script src="src/core/words.js?v=20261028a"></script>
    <script src="src/core/storage.js?v=20261028a"></script>
    <script src="src/core/themes.js?v=20261028a"></script>
    <script src="src/core/audio.js?v=20261028a"></script>

    <!-- Engine: the Duel rules (pure) and the fighters (drawing only) -->
    <script src="src/engine/match-rules.js?v=20261028a"></script>
    <script src="src/engine/typing.js?v=20261028a"></script>
    <script src="src/engine/fighter.js?v=20261028a"></script>
    <script src="src/engine/duel.js?v=20261028a"></script>
    <script src="src/engine/animation/rig.js?v=20261028a"></script>
    <script src="src/engine/animation/motion.js?v=20261028a"></script>
    <script src="src/engine/animation/clips.js?v=20261028a"></script>
    <script src="src/engine/animation/characters.js?v=20261028a"></script>
    <script src="src/engine/animation/combos.js?v=20261028a"></script>
    <script src="src/engine/animation/fighter-stage.js?v=20261028a"></script>
    <script src="src/engine/renderer.js?v=20261028a"></script>

    <!-- Services: settings, your fighter, stats, ratings, identity and the backend swap point -->
    <script src="src/services/settings.js?v=20261028a"></script>
    <script src="src/services/creator.js?v=20261028a"></script>
    <script src="src/services/player.js?v=20261028a"></script>
    <script src="src/services/speed-history.js?v=20261028a"></script>
    <script src="src/services/stats.js?v=20261028a"></script>
    <script src="src/services/ranked.js?v=20261028a"></script>
    <script src="src/services/profile.js?v=20261028a"></script>
    <script src="src/services/backend.js?v=20261028a"></script>

    <!-- UI kit: the building blocks every screen uses -->
    <link rel="stylesheet" href="src/ui/kit.css?v=20261028a" />
    <link rel="stylesheet" href="src/ui/type-view.css?v=20261028a" />
    <script src="src/ui/dom.js?v=20261028a"></script>
    <script src="src/ui/format.js?v=20261028a"></script>
    <script src="src/ui/buttons.js?v=20261028a"></script>
    <script src="src/ui/option-row.js?v=20261028a"></script>
    <script src="src/ui/match-rules-rows.js?v=20261028a"></script>

    <script src="src/ui/clipboard.js?v=20261028a"></script>
    <script src="src/ui/chart-hover.js?v=20261028a"></script>
    <script src="src/ui/rank-badges.js?v=20261028a"></script>
    <script src="src/ui/type-view.js?v=20261028a"></script>
    <script src="src/ui/type-result.js?v=20261028a"></script>

    <!-- Shell: the frame, screens, modals, input, the arena and the loop -->
    <link rel="stylesheet" href="src/app/shell.css?v=20261028a" />
    <link rel="stylesheet" href="src/app/topbar.css?v=20261028a" />
    <script src="src/app/online-gateway.js?v=20261028a"></script>
    <script src="src/app/modals.js?v=20261028a"></script>
    <script src="src/app/router.js?v=20261028a"></script>
    <script src="src/app/actions.js?v=20261028a"></script>

    <script src="src/app/theme-tokens.js?v=20261028a"></script>
    <script src="src/app/sound.js?v=20261028a"></script>

    <!-- Pages -->
    <link rel="stylesheet" href="src/pages/home/home-page.css?v=20261028a" />
    <script src="src/pages/home/home-page.js?v=20261028a"></script>
    <link rel="stylesheet" href="src/pages/howto/howto-page.css?v=20261028a" />
    <script src="src/pages/howto/howto-page.js?v=20261028a"></script>

    <link rel="stylesheet" href="src/pages/creator/creator-page.css?v=20261028a" />
    <script src="src/pages/creator/creator-page.js?v=20261028a"></script>

    <script src="src/pages/stats/stats-charts.js?v=20261028a"></script>

    <script src="src/pages/confirm/confirm-modal.js?v=20261028a"></script>

    <!-- PLUG-IN duel: Mode: Duel (the main typing fight). Delete this block and the game runs without it. -->
    <link rel="stylesheet" href="src/modes/duel/duel-hud.css?v=20261028a" />
    <link rel="stylesheet" href="src/modes/duel/duel-stream-view.css?v=20261028a" />
    <link rel="stylesheet" href="src/modes/duel/duel-result-page.css?v=20261028a" />

    <script src="src/modes/duel/duel-practice.js?v=20261028a"></script>

    <!-- PLUG-IN race: Mode: Race. Delete this block and the game runs without it. -->

    <script src="src/modes/brawl/brawl-mode.js?v=20261028a"></script>
    <!-- /PLUG-IN brawl -->

    <!-- PLUG-IN net: Online play: private rooms over PeerJS (net-keys.js holds your relay keys and is optional). Delete this block and the game runs without it. -->
    <link rel="stylesheet" href="src/net/net.css?v=20261028a" />
    <script src="src/vendor/peerjs.min.js"></script>
    <script src="src/net/net-config.js?v=20261028a"></script>
    <script src="src/net/net-keys.js?v=20261028a"></script>

    <!-- Boot (last): the first screen once every module has started -->
    <script src="src/boot.js?v=20261028a"></script>
  </body>
</html>
